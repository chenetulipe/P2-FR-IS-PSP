name: Script Check

on:
  pull_request:
    paths:
      - 'traduction/**/*.json'

jobs:
  check_scripts:
    name: Check Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter changed scripts
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            changed:
              - 'traduction/**/*.json'
          list-files: 'escape'

      - name: Run Script Validation
        if: ${{ steps.filter.outputs.changed == 'true' }}
        run: |
          python p2is/outils/verify_json.py ${{ steps.filter.outputs.changed_files }}
