<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2IS - Web Patcher</title>
  <meta name="description" content="Patcher officiel pour Persona 2 Innocent Sin FR" />
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            gray: {
              850: '#1f2937',
              900: '#111827',
              950: '#030712'
            },
            primary: {
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030712;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(147, 51, 234, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
      color: #f3f4f6;
      min-height: 100vh;
    }
    
    .drop-zone {
      transition: all 0.2s ease;
    }
    .drop-zone.dragover {
      border-color: #3b82f6;
      background-color: rgba(59, 130, 246, 0.1);
      transform: scale(1.02);
    }
    .drop-zone.loaded {
      border-color: #10b981;
      background-color: rgba(16, 185, 129, 0.05);
    }
    
    .glass-card {
      background: rgba(31, 41, 55, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(75, 85, 99, 0.4);
    }
    
    /* Progress Bar Animation */
    .progress-bar-stripes {
      background-image: linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.15) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, 0.15) 50%,
        rgba(255, 255, 255, 0.15) 75%,
        transparent 75%,
        transparent
      );
      background-size: 1rem 1rem;
      animation: progress-stripes 1s linear infinite;
    }
    @keyframes progress-stripes {
      from { background-position: 1rem 0; }
      to { background-position: 0 0; }
    }
    
    .spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-6">

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
    }
  </script>

  <div class="max-w-3xl w-full mt-10">
    <!-- Header -->
    <header class="text-center mb-10">
      <div class="inline-flex items-center justify-center p-3 bg-primary-500/10 rounded-2xl mb-4 border border-primary-500/20">
        <i data-lucide="disc" class="w-8 h-8 text-primary-400"></i>
      </div>
      <h1 class="text-4xl font-bold tracking-tight mb-3">
        Persona 2 IS <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-purple-400">Patcher</span>
      </h1>
      <p class="text-gray-400 text-lg">
        Application autonome 100% web. Mettez à jour votre ISO ci-dessous.
      </p>
    </header>

    <!-- Main Card -->
    <main class="glass-card rounded-2xl p-8 shadow-2xl shadow-black/50">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        
        <!-- ISO Dropzone -->
        <div id="zone-iso" class="drop-zone relative flex flex-col items-center justify-center p-8 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer hover:border-gray-500 hover:bg-gray-800/50">
          <input type="file" id="in-iso" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".iso,.bin,.img" />
          <i data-lucide="file-archive" id="icon-iso" class="w-10 h-10 text-gray-500 mb-3"></i>
          <h3 class="font-medium text-gray-200 mb-1">1. Fichier ISO</h3>
          <p id="lbl-iso" class="text-sm text-gray-500 text-center px-4">Glissez ULES01557.iso ici</p>
        </div>

        <!-- Patch Dropzone -->
        <div id="zone-patch" class="drop-zone relative flex flex-col items-center justify-center p-8 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer hover:border-gray-500 hover:bg-gray-800/50">
          <input type="file" id="in-patch" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".xdelta,.vcdiff,.patch" />
          <i data-lucide="file-cog" id="icon-patch" class="w-10 h-10 text-gray-500 mb-3"></i>
          <h3 class="font-medium text-gray-200 mb-1">2. Fichier Patch</h3>
          <p id="lbl-patch" class="text-sm text-gray-500 text-center px-4">Glissez le .xdelta ici</p>
        </div>

      </div>

      <!-- Error / Status Area -->
      <div id="alert-box" class="hidden mb-6 p-4 rounded-lg border flex items-start gap-3">
        <i id="alert-icon" data-lucide="info" class="w-5 h-5 shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <h4 id="alert-title" class="font-semibold text-sm mb-1">Status</h4>
          <p id="alert-msg" class="text-sm opacity-90 text-gray-300">Message goes here</p>
        </div>
      </div>

      <!-- Progress Area -->
      <div id="progress-container" class="hidden mb-8">
        <div class="flex justify-between text-sm mb-2 text-gray-400">
          <span id="progress-text">Progression...</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="h-2 w-full bg-gray-700 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-primary-500 progress-bar-stripes" style="width: 0%"></div>
        </div>
      </div>

      <!-- Action Button -->
      <button id="btn-patch" disabled class="w-full flex items-center justify-center gap-2 bg-primary-600 hover:bg-primary-500 disabled:bg-gray-700 disabled:text-gray-500 text-white font-semibold py-4 px-6 rounded-xl transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 shadow-lg">
        <i data-lucide="zap" class="w-5 h-5"></i>
        <span>Appliquer le Patch</span>
      </button>

    </main>

    <footer class="mt-12 text-center text-sm text-gray-500 flex flex-col items-center gap-2">
      <p>Persona 2 Innocent Sin - Projet de traduction FR</p>
      <span class="px-2 py-1 rounded bg-gray-800 text-xs border border-gray-700 text-gray-400">CC BY-NC-SA 4.0</span>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    let isoFile = null;
    let patchFile = null;
    let worker = null;
    
    const btnPatch = document.getElementById('btn-patch');
    const alertBox = document.getElementById('alert-box');
    const alertTitle = document.getElementById('alert-title');
    const alertMsg = document.getElementById('alert-msg');
    const alertIcon = document.getElementById('alert-icon');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const progressPct = document.getElementById('progress-pct');

    function checkReady() {
      if (isoFile && patchFile) {
        btnPatch.disabled = false;
        btnPatch.classList.replace('bg-gray-700', 'bg-primary-600');
        btnPatch.classList.replace('text-gray-500', 'text-white');
      }
    }

    function showAlert(title, msg, type = 'info') {
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/20', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400', 'bg-blue-500/10', 'border-blue-500/20', 'text-blue-400');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-400');
        alertIcon.setAttribute('data-lucide', 'alert-circle');
      } else if (type === 'success') {
        alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
        alertIcon.setAttribute('data-lucide', 'check-circle-2');
      } else {
        alertBox.classList.add('bg-blue-500/10', 'border-blue-500/20', 'text-blue-400');
        alertIcon.setAttribute('data-lucide', 'info');
      }
      
      alertTitle.textContent = title;
      alertMsg.innerHTML = msg.replace(/\n/g, '<br/>');
      lucide.createIcons();
    }

    function updateProgress(pct, text) {
      if (pct === null) {
        progressContainer.classList.add('hidden');
        return;
      }
      progressContainer.classList.remove('hidden');
      progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
      progressPct.textContent = Math.floor(pct) + '%';
      if (text) progressText.textContent = text;
    }

    function formatSize(bytes) {
      if (bytes > 1048576) return (bytes / 1048576).toFixed(1) + ' Mo';
      return (bytes / 1024).toFixed(0) + ' Ko';
    }

    function setupDropzone(zoneId, inputId, lblId, iconId, checkExt, onFile) {
      const zone = document.getElementById(zoneId);
      const input = document.getElementById(inputId);
      const lbl = document.getElementById(lblId);
      const icon = document.getElementById(iconId);

      const processFile = (file) => {
        if (!checkExt.test(file.name)) {
          zone.classList.add('border-red-500', 'bg-red-500/10');
          lbl.textContent = 'Extension invalide';
          lbl.classList.add('text-red-400');
          return;
        }
        
        zone.className = 'drop-zone relative flex flex-col items-center justify-center p-8 border-2 border-dashed rounded-xl cursor-pointer loaded';
        icon.setAttribute('data-lucide', 'check');
        icon.classList.replace('text-gray-500', 'text-emerald-500');
        lbl.innerHTML = `<span class="font-medium text-emerald-400">${file.name}</span><br/><span class="text-xs opacity-75">${formatSize(file.size)}</span>`;
        lucide.createIcons();
        onFile(file);
      };

      input.addEventListener('change', (e) => { if (e.target.files[0]) processFile(e.target.files[0]); });
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => { zone.classList.remove('dragover'); });
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
      });
    }

    setupDropzone('zone-iso', 'in-iso', 'lbl-iso', 'icon-iso', /\.(iso|bin|img)$/i, (f) => {
      isoFile = f; checkReady();
    });

    setupDropzone('zone-patch', 'in-patch', 'lbl-patch', 'icon-patch', /\.(xdelta|vcdiff|patch)$/i, (f) => {
      patchFile = f; checkReady();
    });

    btnPatch.addEventListener('click', () => {
      if (!isoFile || !patchFile) return;
      if (worker) { worker.terminate(); worker = null; }

      btnPatch.disabled = true;
      btnPatch.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 spinner"></i><span>Patch en cours...</span>';
      lucide.createIcons();

      alertBox.classList.add('hidden');
      updateProgress(5, "Initialisation du moteur de patch...");

      worker = new Worker('./xdelta3.worker.js', { type: 'module' });
      
      let outputChunks = [];
      let totalBytes = 0;
      let startTime = Date.now();
      let patchedName = isoFile.name.replace(/\.iso$/i, '_FR.iso');

      worker.onmessage = (e) => {
        if (!e.data) return;
        const data = e.data;

        if (!data.final) {
          // Chunk received
          outputChunks.push(data.bytes);
          totalBytes += data.bytes.length;
          
          let elapsed = (Date.now() - startTime) / 1000;
          let rate = (totalBytes / elapsed / 1048576).toFixed(1);
          let pct = Math.min(95, 5 + (totalBytes / isoFile.size) * 90);
          
          updateProgress(pct, `Application du patch... (${rate} Mo/s)`);
          return;
        }

        if (data.error) {
          worker = null;
          updateProgress(null);
          showAlert("Échec du Patch", "Erreur moteur : " + (data.errorMessage || "Code " + data.errorCode), "error");
          btnPatch.innerHTML = '<i data-lucide="zap" class="w-5 h-5"></i><span>Réessayer</span>';
          btnPatch.disabled = false;
          lucide.createIcons();
          return;
        }

        updateProgress(98, "Finalisation de l'ISO...");
        
        setTimeout(() => {
          try {
            const blob = new Blob(outputChunks, { type: 'application/octet-stream' });
            outputChunks = []; // free memory
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = patchedName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            setTimeout(() => URL.revokeObjectURL(url), 10000);

            updateProgress(100, "Terminé !");
            showAlert(
              "Succès !", 
              `L'ISO a été patchée avec succès.\nFichier : ${patchedName}\nTaille : ${(blob.size / 1048576).toFixed(1)} Mo\nLe téléchargement a commencé.`,
              "success"
            );
          } catch(err) {
            showAlert("Erreur d'écriture", "Votre navigateur manque de mémoire pour finaliser l'ISO.", "error");
          }

          worker = null;
          btnPatch.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i><span>Patch Terminé</span>';
          btnPatch.classList.replace('bg-primary-600', 'bg-emerald-600');
          lucide.createIcons();
          
          setTimeout(() => updateProgress(null), 5000);
        }, 100);
      };

      worker.onerror = (err) => {
        worker = null;
        updateProgress(null);
        showAlert("Erreur Fatale", "Le moteur de patch a planté. " + err.message, "error");
        btnPatch.innerHTML = '<i data-lucide="zap" class="w-5 h-5"></i><span>Appliquer le Patch</span>';
        btnPatch.disabled = false;
        lucide.createIcons();
      };

      worker.postMessage({
        command: 'start',
        sourceFile: isoFile,
        patchFile: patchFile,
        disableChecksum: false
      });
    });
  </script>
</body>
</html>
